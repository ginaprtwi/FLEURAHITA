<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - FLEURAHITA</title>
    <link rel="stylesheet" href="../Css/log-in-user.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="../Js/reset-password.js" defer></script>
</head>
<body>
    <div class="login-container">
        <!-- Left Side - Image Section -->
        <div class="left-section">
            <div class="welcome-content">
            </div>
        </div>

        <!-- Right Side - Form Section -->
        <div class="right-section">
            <div class="logo-container">
                <div class="logo-icon">
                    <img src="../../Assets/img.png" alt="FLEURAHITA Logo">
                </div>
                <span class="logo-text">FLEURAHITA</span>
            </div>

            <div class="form-container">
                <div class="welcome-text" style="margin-bottom: 30px;">
                    <h1>Reset Password</h1>
                    <p style="font-size: 13px; color: #666; margin-top: 8px;">
                        Halo <span id="userName" style="font-weight: 600; color: #8B2635;"></span>, masukkan password baru Anda
                    </p>
                </div>

                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label for="newPassword">Password Baru</label>
                        <div class="password-input">
                            <input type="password" id="newPassword" name="newPassword" placeholder="Masukkan password baru" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('newPassword')">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 9.5C11.17 9.5 10.5 10.17 10.5 11C10.5 11.83 11.17 12.5 12 12.5C12.83 12.5 13.5 11.83 13.5 11C13.5 10.17 12.83 9.5 12 9.5Z" fill="#999"/>
                                    <path d="M12 5C7 5 2.73 8.11 1 12C2.73 15.89 7 19 12 19C17 19 21.27 15.89 23 12C21.27 8.11 17 5 12 5Z" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Konfirmasi Password Baru</label>
                        <div class="password-input">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Konfirmasi password baru" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 9.5C11.17 9.5 10.5 10.17 10.5 11C10.5 11.83 11.17 12.5 12 12.5C12.83 12.5 13.5 11.83 13.5 11C13.5 10.17 12.83 9.5 12 9.5Z" fill="#999"/>
                                    <path d="M12 5C7 5 2.73 8.11 1 12C2.73 15.89 7 19 12 19C17 19 21.27 15.89 23 12C21.27 8.11 17 5 12 5Z" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Reset Password</button>
                    
                    <div class="register-link">
                        <a href="../log-in-user.html">Kembali ke Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
