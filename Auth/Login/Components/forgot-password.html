<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - FLEURAHITA</title>
    <link rel="stylesheet" href="../Css/log-in-user.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="../Js/forgot-password.js" defer></script>
</head>
<body>
    <div class="login-container">
        <!-- Left Side - Image Section -->
        <div class="left-section">
            <div class="welcome-content">
            </div>
        </div>

        <!-- Right Side - Form Section -->
        <div class="right-section">
            <div class="logo-container">
                <div class="logo-icon">
                    <img src="../../Assets/img.png" alt="FLEURAHITA Logo">
                </div>
                <span class="logo-text">FLEURAHITA</span>
            </div>

            <div class="form-container">
                <div class="welcome-text" style="margin-bottom: 30px;">
                    <h1>Lupa Password?</h1>
                    <p style="font-size: 13px; color: #666; margin-top: 8px;">
                        Masukkan email dan nomor HP yang terdaftar untuk verifikasi
                    </p>
                </div>

                <form id="forgotPasswordForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Masukkan Email" required>
                    </div>

                    <div class="form-group">
                        <label for="noHp">No HP</label>
                        <input type="tel" id="noHp" name="noHp" placeholder="Masukkan No HP" required>
                    </div>

                    <button type="submit" class="submit-btn">Verifikasi</button>
                    
                    <div class="register-link">
                        Ingat password? <a href="../log-in-user.html">Login Sekarang!</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
