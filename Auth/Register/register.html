<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FLEURAHITA</title>
    <link rel="stylesheet" href="Css/register.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="Js/register.js" defer></script>
</head>
<body>
    <div class="register-container">
        <!-- Left Side - Image Section -->
        <div class="left-section">
            <div class="welcome-content">
            </div>
        </div>

        <!-- Right Side - Form Section -->
        <div class="right-section">
            <div class="logo-container">
                <div class="logo-icon">
                    <img src="../Assets/img.png" alt="FLEURAHITA Logo">
                </div>
                <span class="logo-text">FLEURAHITA</span>
            </div>

            <div class="form-container">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="namaLengkap">Nama Lengkap</label>
                        <input type="text" id="namaLengkap" name="namaLengkap" placeholder="Nama Lengkap" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Masukkan Email" required>
                    </div>

                    <div class="form-group">
                        <label for="noHp">No HP</label>
                        <input type="tel" id="noHp" name="noHp" placeholder="Masukkan No HP" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input">
                            <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 5C7 5 2.73 8.11 1 12C2.73 15.89 7 19 12 19C17 19 21.27 15.89 23 12C21.27 8.11 17 5 12 5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Konfirmasi Password</label>
                        <div class="password-input">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Konfirmasi password" required>
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 5C7 5 2.73 8.11 1 12C2.73 15.89 7 19 12 19C17 19 21.27 15.89 23 12C21.27 8.11 17 5 12 5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Masuk</button>
                    
                    <div class="login-link">
                        Sudah memiliki akun? <a href="../Login/log-in-user.html">Login Sekarang!</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
