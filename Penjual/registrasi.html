<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Playfair Display:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Plus Jakarta Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/reset.css" />
	<link rel="stylesheet" href="css/global.css" />
	<link rel="stylesheet" href="css/registrasi.css" />

</head>

<body>
	<div class="sign-in-form-desktop1">
		<div class="sign-in-form-desktop-sign-in-form1">
			<img src="assets/sign-in-form-desktop-img.png" class="img-b" />
			
			<div class="card-sign-in-forms card-white1">
				<div class="card-sign-in-forms-web">
					<div class="card-sign-in-forms-col">
						<div class="input-group-configurator-a input-group-configurator2">
							<p class="input-group-configurator-text2">Nama Depan</p>
							<input class="input-login input-group-configurator-login2" value="Email atau nomor telepon" />
						</div>
						
						<div class="input-group-configurator-b input-group-configurator3">
							<p class="text-i">Nama Belakang</p>
							<input class="input-login input-group-configurator-login3" value="Email atau nomor telepon" />
						</div>
						
						<input class="input-login card-sign-in-forms-input1" value="Email atau nomor telepon" />
						
						<div class="card-sign-in-forms-input2">
							<p class="card-sign-in-forms-text-satellite1 hint-placeholder">Password</p>
							
							<div class="input-a password-input">
								<p class="input-text placeholder-value">Masukan password</p>
								<object data="assets/sign-in-form-desktop-input-icons.svg" class="input-icons" type="image/svg+xml"></object>
							</div>
						</div>
						
						<div class="card-sign-in-forms-input3">
							<p class="card-sign-in-forms-text-satellite2 hint-placeholder">Password</p>
							
							<div class="card-sign-in-forms-password">
								<object data="assets/registrasi/card-sign-in-forms-regular-input.svg" class="card-sign-in-forms-regular-input" type="image/svg+xml"></object>
							</div>
						</div>
					</div>
					
					<button class="btn-primary-40px card-sign-in-forms-btn-primary hover-bright">Masuk</button>
					<div class="card-sign-in-forms-line"></div>
					
					<button class="btn-google-big hover-bright">
						<object data="assets/registrasi/btn-google-big-icon.svg" class="btn-google-big-icon" type="image/svg+xml"></object>
						<p class="btn-google-big-label checkbox">Or sign in with Google</p>
					</button>
				</div>
				
				<div class="card-sign-in-forms-up-offer">
					<p class="card-sign-in-forms-text1 checkbox">Dont have an account?</p>
					<p class="card-sign-in-forms-text2 checkbox">Sign up now</p>
				</div>
			</div>
		</div>
		
		<div class="group-b">
		</div>
		
		<div class="circle-a circle2">
			<object data="assets/_01-images-avatar.svg" class="circle-_01-images-avatar circle-01-images" type="image/svg+xml"></object>
		</div>
		
		<div class="sign-in-form-desktop-row">
			<div class="circle-gray sign-in-form-desktop-circle-gray-left"></div>
			<p class="sign-in-form-desktop-text2">FLEURAHITA</p>
		</div>
	</div>
	
	<div class="sign-in-form-desktop2">
		<div class="sign-in-form-desktop-group2">
			<div class="sign-in-form-desktop-sign-in-form2">
				<img src="assets/registrasi/sign-in-form-desktop-img.png" class="img-b" />
				
				<div class="sign-in-form-desktop-col-right card-white1">
					<img src="assets/img2.png" class="sign-in-form-desktop-img-top" />
					
					<div class="sign-in-form-desktop-forms2 group1">
						<div class="sign-in-form-desktop-col4">
							<div class="input-group-configurator-a input-group-configurator4">
								<p class="input-group-configurator-text2">Nama Lengkap</p>
								<input class="input-login input-group-configurator-login2" value="Nama Lengkap" />
							</div>
							
							<div class="input-group-configurator-b input-group-configurator5">
								<p class="text-i">Email</p>
								<input class="input-login input-group-configurator-login3" value="Masukan Email" />
							</div>
							
							<div class="input-group-configurator-b input-group-configurator6">
								<p class="text-i">No HP</p>
								<input class="input-login input-group-configurator-login3" value="Nomor telepon" />
							</div>
							
							<p class="text-i">Password</p>
							
							<div class="input-a input-configurator1">
								<p class="input-text placeholder-value">Masukan password</p>
								<object data="assets/sign-in-form-desktop-input-icons.svg" class="input-icons" type="image/svg+xml"></object>
							</div>
							
							<p class="text-i">Konfirmasi Password</p>
							
							<div class="input-a input-configurator2">
								<p class="input-text placeholder-value">Konfirmasi password</p>
								<object data="assets/sign-in-form-desktop-input-icons.svg" class="input-icons" type="image/svg+xml"></object>
							</div>
						</div>
						
						<button class="btn-primary-40px sign-in-form-desktop-btn-primary2 hover-bright">Masuk</button>
					</div>
				</div>
			</div>
			
			<div class="group-b">
			</div>
			
			<div class="circle-a circle3">
				<object data="assets/_01-images-avatar.svg" class="circle-_01-images-avatar circle-01-images" type="image/svg+xml"></object>
			</div>
			
			<p class="sign-in-form-desktop-text-fleurahita2 text-main-color">FLEURAHITA</p>
		</div>
	</div>
</body>

</html>
