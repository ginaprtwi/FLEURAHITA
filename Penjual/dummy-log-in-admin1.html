<body>
	<div class="sign-in-form-desktop sign-in-form-desktop1">
		<div class="sign-in-form-desktop-col-left card-white1">

				<div class="sign-in-form-desktop-row-left">
					<div class="circle-gray sign-in-form-desktop-circle"></div>
					<img src="assets/img.png" class="sign-in-form-desktop-img1" />
				</div>
				
				<p class="sign-in-form-desktop-text-fleurahita">FLEURAHITA</p>
			</div>
			
			<div class="sign-in-form-desktop-forms group1">

					<p class="sign-in-form-desktop-text title">Hai Seller,</p>
					
					<div class="sign-in-form-desktop-col2">
						<div class="sign-in-form-desktop-col3">
							<div class="input-group-configurator">
								<p class="input-group-configurator-text1 text-black-800-333333">Masuk</p>
								<input class="input-group-configurator-login1" value="Masukkan email / telepon" />
							</div>
							
							<div class="sign-in-form-desktop-input">

									<p class="sign-in-form-desktop-text-left">Masukkan kata sandi</p>
									<div class="sign-in-form-desktop-input-icons">
									</div>
									<object data="assets/sign-in-form-desktop-password-input/sign-in-form-desktop-graphic.svg" class="sign-in-form-desktop-graphic" type="image/svg+xml"></object>
								</div>
							</div>
						</div>
						
						<div class="row-a">
							<div class="row-switcher1">
								<div class="row-switcher2">
									<div class="row-circle1"></div>
								</div>

							</div>
							
							<p class="row-text2">Lupa kata sandi?</p>
						</div>
					</div>
				</div>
				
				<button class="sign-in-form-desktop-btn-primary hover-bright">Masuk</button>
			</div>
