<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Produk Saya — Fleurahita</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/produk-saya.css" />
</head>

<body>

    <!-- ═══ SIDEBAR (loaded by components.js) ═══ -->
    <div id="sidebar-container"></div>

    <!-- ═══ MAIN CONTENT ═══ -->
    <div class="ps-wrapper">

        <!-- Navbar (loaded by components.js) -->
        <div id="navbar-container" class="ps-navbar"></div>
        <div class="ps-navbar-divider"></div>

        <!-- Page body -->
        <main class="ps-main">

            <h2 class="ps-title subtitle-main-color">Produk Saya</h2>

            <!-- Toolbar: search + tambah -->
            <div class="ps-toolbar">
                <div class="ps-search">
                    <object data="../assets/row/row-vuesax-outline-343.svg"
                            class="ps-search-icon" type="image/svg+xml" aria-hidden="true"></object>
                    <input type="text" id="ps-search-input"
                           class="ps-search-input" placeholder="Cari produk..." />
                </div>

                <button class="ps-btn-tambah hover-bright" id="btn-tambah-produk">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Tambah Produk</span>
                </button>
            </div>

            <!-- Product table -->
            <div class="ps-card">

                <!-- Table header -->
                <div class="ps-table-header">
                    <div class="ps-col-produk">Produk</div>
                    <div class="ps-col-harga">Harga</div>
                    <div class="ps-col-stok">Stok</div>
                    <div class="ps-col-aksi">Aksi</div>
                </div>

                <!-- Table body (filled by JS) -->
                <div id="ps-table-body">
                    <div class="ps-loading">Memuat produk...</div>
                </div>

                <!-- Pagination -->
                <div class="table-pagination" id="ps-pagination" style="display:none;"></div>
            </div>

        </main>
    </div>

    <!-- ═══ MODAL TAMBAH / EDIT PRODUK ═══ -->
    <div id="ps-modal" class="ps-modal" role="dialog" aria-modal="true" aria-labelledby="ps-modal-title" style="display:none;">
        <div class="ps-modal-backdrop" id="ps-modal-backdrop"></div>
        <div class="ps-modal-box">
            <div class="ps-modal-header">
                <h2 id="ps-modal-title" class="ps-modal-title">Tambah Produk</h2>
                <button class="ps-modal-close" id="ps-modal-close" aria-label="Tutup">✕</button>
            </div>

            <input type="hidden" id="ps-modal-id" />

            <div class="ps-form-grid">
                <div class="ps-form-group">
                    <label class="ps-label" for="ps-f-nama">Nama Produk</label>
                    <input id="ps-f-nama" class="ps-input" type="text" placeholder="Nama produk" />
                </div>

                <div class="ps-form-group">
                    <label class="ps-label" for="ps-f-harga">Harga (Rp)</label>
                    <input id="ps-f-harga" class="ps-input" type="number" min="0" placeholder="0" />
                </div>

                <div class="ps-form-group">
                    <label class="ps-label" for="ps-f-stok">Stok</label>
                    <input id="ps-f-stok" class="ps-input" type="number" min="0" placeholder="0" />
                </div>

                <div class="ps-form-group">
                    <label class="ps-label" for="ps-f-kategori">Kategori</label>
                    <select id="ps-f-kategori" class="ps-input">
                        <option value="">-- Pilih kategori --</option>
                        <option value="Bucket Bunga">Bucket Bunga</option>
                        <option value="Bucket Bunga + Boneka">Bucket Bunga + Boneka</option>
                        <option value="Bucket Snack">Bucket Snack</option>
                        <option value="Bucket Uang">Bucket Uang</option>
                        <option value="Bunga Papan">Bunga Papan</option>
                    </select>
                </div>

                <div class="ps-form-group ps-form-group--full">
                    <label class="ps-label" for="ps-f-deskripsi">Deskripsi</label>
                    <textarea id="ps-f-deskripsi" class="ps-input ps-textarea"
                              placeholder="Deskripsi produk..." rows="3"></textarea>
                </div>
            </div>

            <p id="ps-modal-error" class="ps-modal-error" role="alert"></p>

            <div class="ps-modal-actions">
                <button id="ps-modal-cancel" class="ps-btn-cancel">Batal</button>
                <button id="ps-modal-submit" class="ps-btn-submit">Simpan</button>
            </div>
        </div>
    </div>

    <!-- ═══ MODAL KONFIRMASI HAPUS ═══ -->
    <div id="ps-confirm-modal" class="ps-modal" role="dialog" aria-modal="true" style="display:none;">
        <div class="ps-modal-backdrop" id="ps-confirm-backdrop"></div>
        <div class="ps-modal-box ps-modal-box--sm">
            <h2 class="ps-modal-title">Hapus Produk?</h2>
            <p class="ps-confirm-text">Produk <strong id="ps-confirm-nama"></strong> akan dihapus permanen.</p>
            <div class="ps-modal-actions">
                <button id="ps-confirm-cancel" class="ps-btn-cancel">Batal</button>
                <button id="ps-confirm-ok"     class="ps-btn-hapus">Ya, Hapus</button>
            </div>
        </div>
    </div>

    <script src="../js/components.js"></script>
    <script src="../js/produk-saya.js"></script>
</body>
</html>
