<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Pesanan Masuk - FLEURAHITA</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Links -->
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/pesanan-masuk.css" />
</head>

<body style="display: flex;">

    <!-- 1. Container Sidebar (Modular) -->
    <div id="sidebar-container"></div>

    <!-- Area Kanan (Navbar + Content) -->
    <div style="flex-grow: 1; display: flex; flex-direction: column; width: 100%;">

        <!-- 2. Container Navbar -->
        <div id="navbar-container"></div>
        <div class="line-b line1"></div>

        <!-- 3. Konten Utama -->
        <main class="col2">
            
            <h2 class="subtitle-pesanan-masuk subtitle-main-color">Pesanan Masuk</h2>
            
            <!-- Filter & Search Bar -->
            <div class="row8">
                <!-- Search Bar (Ukuran disamakan seperti halaman Pengiriman) -->
                <div class="cari-pesanan-box">
                    <input type="text" placeholder="Cari Pesanan..." />
                    <button type="submit" style="background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center;">
                        <img src="../assets/pesanan-masuk/vuesax-outline-search.svg" class="icon-search-svg" alt="Cari" />
                    </button>
                </div>
                
                <!-- Filter Status -->
                <div class="row-i row-right">
                    <div class="iconly-light-outline-filter iconly-light">
                        <img src="../assets/iconly-light-outline-filter/iconly-light-outline-filter-filter.png" class="iconly-light-outline-filter-filter" />
                    </div>
                    
                    <p class="row-text8">Semua Status</p>
                    <object data="../assets/row/row-iconly-light-338.svg" class="row-iconly-light-outline-arrow-b row-iconly-light" type="image/svg+xml"></object>
                </div>
            </div>
            
            <!-- Card Container Tabel Data -->
            <div class="col3">
                
                <!-- Header Tabel (Status DULU, baru Aksi) -->
                <div class="table-header">
                    <div>Produk</div>
                    <div>Nama Pembeli</div>
                    <div>Total</div>
                    <div>Status</div>
                    <div>Aksi</div>
                </div>
                
                <!-- Body Tabel (Baris Data) -->
                <div id="table-body">

                    <!-- Baris 1 -->
                    <div class="table-row">
                        <!-- Produk -->
                        <div class="col-produk">
                            <div class="column-b col4">
                                <div class="rect column-rect"></div>
                                <img src="../assets/pesanan-masuk/column/column-img2.png" class="img-a" />
                            </div>
                            <span class="text-sweet-aurora1 text-dark">Sweet Aurora Bloom</span>
                        </div>

                        <!-- Nama Pembeli -->
                        <div>Reza Fahrizki</div>

                        <!-- Total -->
                        <div>250.000</div>

                        <!-- Status -->
                        <div class="col-status">
                            <div class="column-c col5">
                                <object data="../assets/pesanan-masuk/column/column-iconly-light.svg" class="column-iconly-light-outline-tick column-iconly-light1" type="image/svg+xml"></object>
                                <p class="column-text1">Selesai</p>
                            </div>
                        </div>

                        <!-- Aksi -->
                        <div class="col-aksi">
                            <span class="text-detail">Detail</span>
                            <button class="btn-belum-lunas hover-dark">Belum Lunas</button>
                            <div class="iconly-light2">
                                <object data="../assets/pesanan-masuk/iconly-light-fill.svg" class="iconly-light-fill" type="image/svg+xml"></object>
                                <img src="../assets/pesanan-masuk/iconly-light-img.png" class="iconly-light-img" />
                            </div>
                        </div>
                    </div>

                    <!-- Baris 2 -->
                    <div class="table-row">
                        <!-- Produk -->
                        <div class="col-produk">
                            <div class="col-left1">
                                <div class="rect rect1"></div>
                                <img src="../assets/pesanan-masuk/img1.png" class="img-a" />
                            </div>
                            <span class="text-lush-plush text-dark">Lush & Plush</span>
                        </div>

                        <!-- Nama Pembeli -->
                        <div>Reisya Seinanda</div>

                        <!-- Total -->
                        <div>250.000</div>

                        <!-- Status -->
                        <div class="col-status">
                            <div class="column-c col7">
                                <object data="../assets/pesanan-masuk/column/column-iconly-light.svg" class="column-iconly-light-outline-tick column-iconly-light1" type="image/svg+xml"></object>
                                <p class="column-text1">Selesai</p>
                            </div>
                        </div>

                        <!-- Aksi -->
                        <div class="col-aksi">
                            <div class="column-d">
                                <div class="column-iconly-light2">
                                    <object data="../assets/pesanan-masuk/iconly-light-fill.svg" class="column-fill" type="image/svg+xml"></object>
                                    <img src="../assets/pesanan-masuk/column-iconly-light-outline-show/column-img.png" class="column-img2" />
                                </div>
                                <p class="column-text2">Detail</p>
                            </div>
                            <button class="btn-belum-lunas hover-dark">Belum Lunas</button>
                        </div>
                    </div>

                    <!-- Baris 3 -->
                    <div class="table-row">
                        <!-- Produk -->
                        <div class="col-produk">
                            <div class="col-left2">
                                <div class="rect rect2"></div>
                                <img src="../assets/pesanan-masuk/column/column-img2.png" class="img-a" />
                            </div>
                            <span class="text-sweet-aurora2 text-dark">Sweet Aurora Bloom</span>
                        </div>

                        <!-- Nama Pembeli -->
                        <div>Hendri Pradita</div>

                        <!-- Total -->
                        <div>250.000</div>

                        <!-- Status -->
                        <div class="col-status">
                            <div class="column-c col9">
                                <object data="../assets/pesanan-masuk/column/column-iconly-light.svg" class="column-iconly-light-outline-tick column-iconly-light1" type="image/svg+xml"></object>
                                <p class="column-text1">Selesai</p>
                            </div>
                        </div>

                        <!-- Aksi -->
                        <div class="col-aksi">
                            <div class="column-d">
                                <div class="column-iconly-light2">
                                    <object data="../assets/pesanan-masuk/iconly-light-fill.svg" class="column-fill" type="image/svg+xml"></object>
                                    <img src="../assets/pesanan-masuk/column-iconly-light-outline-show/column-img.png" class="column-img2" />
                                </div>
                                <p class="column-text2">Detail</p>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </main>

    </div>

    <!-- Component Loader -->
    <script src="../js/components.js"></script>
    <script src="../js/pesanan-masuk.js"></script>
</body>
</html>
