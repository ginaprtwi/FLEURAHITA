<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akun Saya - FLEURAHITA</title>
    
    <!-- CSS Links -->
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/akun-saya.css">
    
    <style>
        /* Prevent FOUC - hide until loaded */
        #sidebar-container:empty {
            opacity: 0;
        }
        #sidebar-container {
            transition: opacity 0.15s ease-in;
        }
        #navbar-container:empty {
            opacity: 0;
        }
        #navbar-container {
            transition: opacity 0.15s ease-in;
        }
    </style>
</head>

<body style="display: flex;">
    <!-- Sidebar Component -->
    <div id="sidebar-container"></div>

    <!-- Area Kanan (Navbar + Content) -->
    <div style="flex-grow: 1; display: flex; flex-direction: column; width: 100%;">
        <!-- Navbar Component -->
        <div id="navbar-container"></div>
        <div class="line-c line1" style="width: 100%; height: 1px; background-color: #eee; display: block;"></div>

        <!-- Konten Utama -->
        <main class="content-wrapper">
            <h1 class="page-title">Akun Saya</h1>

            <div class="container">
                <!-- Main Edit Card -->
                <div class="card main-card">
                    <h2>Ubah Akun</h2>

                    <div class="field-group">
                        <label for="avatarInput">Unggah Avatar</label>
                        <label class="avatar-upload" id="avatarUploadBox">
                            <img id="avatarPreview" src="" alt="Avatar" style="display: none;">
                            <div class="upload-placeholder" id="uploadPlaceholder">
                                <img src="../assets/picture-icon.svg" class="icon" id="avatarIcon" alt="Upload">
                                <span id="avatarText">Masukan Gambar</span>
                            </div>
                            <input type="file" id="avatarInput" accept="image/*">
                        </label>
                    </div>

                    <div class="field-group">
                        <label for="namaPenjual">Nama Penjual</label>
                        <input type="text" id="namaPenjual" placeholder="Masukkan nama">
                    </div>

                    <div class="field-group">
                        <label for="nomorTelepon">Nomor Telepon</label>
                        <input type="tel" id="nomorTelepon" placeholder="Masukkan nomor telepon">
                    </div>

                    <div class="field-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Masukkan email" readonly>
                    </div>

                    <div class="btn-row">
                        <button class="btn-simpan" id="simpanBtn">SIMPAN PERUBAHAN</button>
                    </div>
                </div>

                <!-- Side Profile Card -->
                <div class="card side-card">
                    <h3 id="sideNama">Loading...</h3>
                    <div class="info-line" id="sidePhone">Loading...</div>
                    <div class="info-line" id="sideEmail">Loading...</div>
                    <div class="side-avatar" id="sideAvatarBox">
                        <img id="sideAvatarPreview" src="" alt="Avatar" style="display: none;">
                        <div class="side-placeholder" id="sidePlaceholder">
                            <img src="../assets/picture-icon.svg" class="icon" alt="Avatar">
                            <span>Masukan Gambar</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script Component Loader -->
    <script src="../js/components.js"></script>
    <script src="../js/akun-saya.js"></script>
</body>

</html>
