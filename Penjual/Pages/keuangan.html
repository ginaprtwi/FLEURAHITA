<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Keuangan - FLEURAHITA</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Playfair+Display:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    
    <!-- CSS Links -->
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/keuangan.css" />
</head>

<body style="display: flex;">

    <!-- 1. Container Sidebar (Diisi otomatis via components.js) -->
    <div id="sidebar-container"></div>

    <!-- Area Kanan (Navbar + Content) -->
    <div style="flex-grow: 1; display: flex; flex-direction: column; width: 100%;">

        <!-- 2. Container Navbar (Diisi otomatis via components.js) -->
        <div id="navbar-container"></div>
        <div class="line-c line1" style="width: 100%; height: 1px; background-color: #eee; display: block;"></div>

        <!-- 3. Konten Utama Keuangan -->
        <main class="col2">
            <h2 class="subtitle-keuangan subtitle-main-color">Keuangan</h2>
            
            <!-- Cards Informasi Keuangan -->
            <div class="informations">
                <!-- Total Saldo -->
                <div class="card-left">
                    <div class="card-left-circle circle">
                        <div class="card-left-img" title="Total Saldo"></div>
                    </div>
                    <div class="column-f col-bottom1">
                        <p class="column-text3">Total Saldo</p>
                        <h2 class="column-subtitle" id="nilai-total-saldo">Rp. 1.000.000</h2>
                    </div>
                </div>
                
                <!-- Jumlah Transaksi -->
                <div class="card">
                    <div class="card-circle">
                        <span class="symbol-dollar" style="font-size: 22px; font-weight: 700; color: #820805; font-family: 'Poppins', sans-serif; line-height: 1;">$</span>
                    </div>
                    <div class="column-f col-bottom2">
                        <p class="column-text3">Jumlah Transaksi</p>
                        <h2 class="column-subtitle"><span id="nilai-jumlah-transaksi">10 Transaksi</span></h2>
                    </div>
                </div>
                
                <!-- Pendapatan Bulan Ini -->
                <div class="card-right">
                    <div class="circle-light-c circle-light-top">
                        <object data="../assets/keuangan/circle-light/circle-light-iconly.svg" class="circle-light-iconly" type="image/svg+xml" style="pointer-events: none;"></object>
                    </div>
                    <div class="column-f col-bottom3">
                        <p class="column-text3">Pendapatan Bulan ini</p>
                        <h2 class="column-subtitle"><span id="nilai-pendapatan-bulan">Rp. 500.000</span></h2>
                    </div>
                </div>
            </div>
            
            <!-- Tombol Tarik Saldo -->
            <button class="btn-a btn4 hover-bright">TARIK SALDO</button>
            
            <!-- Card Utama (Tabel Transaksi) -->
            <div class="col3">
                <!-- Toolbar atas tabel -->
                <div class="row-top3">
                    <p class="text-left text4">Daftar Transaksi</p>
                    
                    <div class="row-f row10">
                        <input type="text" placeholder="Cari Produk..." class="input-cari-produk" />
                        <button type="button" class="btn-search-trigger" style="background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center;">
                            <object data="../assets/row/row-vuesax-outline2.svg" class="row-vuesax-outline-search-b row-vuesax-outline3" type="image/svg+xml" style="pointer-events: none;"></object>
                        </button>
                    </div>
                    
                    <!-- Dropdown Filter & Urutan Transaksi -->
                    <div class="row-right btn-sort-keuangan" style="position: relative; cursor: pointer;">
                        <div class="dropdown-trigger-keuangan" style="display: flex; align-items: center; gap: 10px; width: 100%; pointer-events: none;">
                            <div class="iconly-light-outline-filter iconly-light2">
                                <img src="../assets/iconly-light-outline-filter/iconly-light-outline-filter-filter.png" class="iconly-light-outline-filter-filter" alt="Filter" style="pointer-events: none;" />
                            </div>
                            <p class="text-urutkan-transaksi" style="margin: 0; pointer-events: none;">Urutkan: Terbaru</p>
                            <object data="../assets/row/row-iconly-light-970.svg" class="iconly-light-outline-arrow iconly-light3 dropdown-arrow-keuangan" type="image/svg+xml" style="pointer-events: none; transition: transform 0.2s;"></object>
                        </div>

                        <!-- Dropdown Menu Options -->
                        <div class="sort-dropdown-menu-keuangan">
                            <div class="sort-option-keuangan active" data-sort="terbaru" style="padding: 10px 16px; color: #333; cursor: pointer; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px;">
                                <span>🕒</span> Terbaru
                            </div>
                            <div class="sort-option-keuangan" data-sort="terlama" style="padding: 10px 16px; color: #333; cursor: pointer; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px;">
                                <span>⏳</span> Terlama
                            </div>
                            <div class="sort-option-keuangan" data-sort="tertinggi" style="padding: 10px 16px; color: #333; cursor: pointer; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px;">
                                <span>📈</span> Nominal Tertinggi
                            </div>
                            <div class="sort-option-keuangan" data-sort="terendah" style="padding: 10px 16px; color: #333; cursor: pointer; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px;">
                                <span>📉</span> Nominal Terendah
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Header Tabel Grid -->
                <div class="table-header">
                    <div>No. Pesanan</div>
                    <div>Nama Pembeli</div>
                    <div>Produk</div>
                    <div>Total</div>
                    <div>Tanggal</div>
                </div>
                
                <!-- Body Tabel (Data Transaksi Dinamis) -->
                <div id="table-body">
                    <!-- Diisi secara dinamis via keuangan.js -->
                </div>

                <!-- Control Pagination (Single Horizontal Line) -->
                <div class="table-pagination" id="pagination-container">
                    <!-- Kiri: Info Results -->
                    <div class="pagination-results-text">
                        Results: <span id="page-start">0</span> - <span id="page-end">0</span> of <span id="total-count">0</span>
                    </div>

                    <!-- Kanan: Tombol Navigasi Angka + Dropdown Per Page -->
                    <div class="pagination-right-controls">
                        <div class="pagination-buttons-row">
                            <button class="btn-page-nav" id="btn-prev" aria-label="Previous Page">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                            </button>
                            <div class="page-numbers" id="page-numbers"></div>
                            <button class="btn-page-nav" id="btn-next" aria-label="Next Page">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            </button>
                        </div>
                        <div class="per-page-selector">
                            <select id="items-per-page-select" class="per-page-select">
                                <option value="8" selected>8</option>
                                <option value="10">10</option>
                                <option value="20">20</option>
                            </select>
                        </div>
                    </div>
                </div>

            </div>
        </main>

    </div>

    <!-- Script Component Loader -->
    <script src="../js/components.js"></script>
    <script src="../js/keuangan.js"></script>
</body>
</html>
