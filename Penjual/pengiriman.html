<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Playfair Display:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Plus Jakarta Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/reset.css" />
	<link rel="stylesheet" href="css/global.css" />
	<link rel="stylesheet" href="css/pengiriman.css" />
</head>

<body>
	<div class="group4">
		<!-- Sidebar Menu -->
		<div class="sidebar-menu card-light2">
			<div class="sidebar-menu-menu">
				<button class="btn-light-a btn-light5 hover-dark">
					<div class="icon-ly-light-outline-home icon-ly-light1">
						<img src="assets/icon-ly-light-outline-home/icon-ly-light-outline-home-home.png" class="icon-ly-light-outline-home-home" />
					</div>
					<p class="label">Beranda</p>
				</button>
				
				<div class="row-d row5-menu">
					<object data="assets/row/row-streamline.svg" class="row-iconly-light-outline-arrow-a row-vuesax-outline1" type="image/svg+xml"></object>
					<p class="label">Produk Saya</p>
				</div>
				
				<button class="btn-light-e btn-light6 hover-dark">
					<div class="icon-ly-light-outline-document icon-ly-light5">
						<img src="assets/icon-ly-light-outline-document/icon-ly-light-outline-document-img.png" class="icon-ly-light-outline-document-img" />
						<object data="assets/icon-ly-light-outline-document/icon-ly-light-outline-document-fill.svg" class="icon-ly-light-outline-document-fill icon-ly-light-outline-document-fill1" type="image/svg+xml"></object>
						<object data="assets/icon-ly-light-outline-document/icon-ly-light-outline-document-fill2.svg" class="icon-ly-light-outline-document-fill icon-ly-light-outline-document-fill2" type="image/svg+xml"></object>
						<object data="assets/icon-ly-light-outline-document/icon-ly-light-outline-document-fill2.svg" class="icon-ly-light-outline-document-fill icon-ly-light-outline-document-fill3" type="image/svg+xml"></object>
					</div>
					<p class="text-b">Pesanan Masuk</p>
				</button>
				
				<div class="row-b row6-menu">
					<object data="assets/pengiriman/row/row-mdi-light.svg" class="row-vuesax-outline-user-octagon row-streamline" type="image/svg+xml"></object>
					<p class="text-a">Pengiriman</p>
				</div>
				
				<button class="btn-light-c btn-light7 hover-dark">
					<div class="icon-ly-light-outline-chat icon-ly-light3">
						<div class="icon-ly-light-outline-chat-chat">
							<object data="assets/icon-ly-light-outline-chat-chat/icon-ly-light-outline-chat-fill.svg" class="icon-ly-light-outline-chat-fill" type="image/svg+xml"></object>
						</div>
					</div>
					<p class="label">Chat & Komplain</p>
				</button>
			</div>
			
			<div class="line-a"></div>
			
			<div class="column-a col-bottom">
				<div class="row-c row-top1">
					<object data="assets/row/row-ant-design.svg" class="row-ant-design-form-outlined row-mdi-light" type="image/svg+xml"></object>
					<p class="text-b">Profil Toko</p>
				</div>
				
				<div class="row-d row1">
					<object data="assets/row/row-vuesax-outline.svg" class="row-iconly-light-outline-arrow-a row-vuesax-outline1" type="image/svg+xml"></object>
					<p class="label">Akun Saya</p>
				</div>
				
				<button class="btn-light-d btn-light1 hover-dark">
					<div class="icon-ly-light-outline-wallet icon-ly-light4">
						<div class="icon-ly-light-outline-wallet-group">
							<object data="assets/icon-ly-light-outline-wallet-group/icon-ly-light-outline-wallet-fill.svg" class="icon-ly-light-outline-wallet-fill1" type="image/svg+xml"></object>
							<object data="assets/icon-ly-light-outline-wallet-group/icon-ly-light-outline-wallet-fill2.svg" class="icon-ly-light-outline-wallet-fill2" type="image/svg+xml"></object>
						</div>
						<img src="assets/icon-ly-light-outline-wallet/icon-ly-light-outline-wallet-img.png" class="icon-ly-light-outline-wallet-img" />
						<object data="assets/icon-ly-light-outline-wallet/icon-ly-light-outline-wallet-fill.svg" class="icon-ly-light-outline-wallet-fill3" type="image/svg+xml"></object>
					</div>
					<p class="label">Keuangan</p>
				</button>
				
				<div class="row-d row-bottom1">
					<object data="assets/row/row-iconly-light.svg" class="row-iconly-light-outline-arrow-a row-vuesax-outline1" type="image/svg+xml"></object>
					<p class="label">Logout</p>
				</div>
			</div>
		</div>
		
		<!-- Top Bar dengan Logo -->
		<div class="top-bar-wrapper">
			<div class="top-bar-left">
				<div class="logo-container">
					<div class="circle-light-a circle-light1"></div>
					<img src="assets/row-column/row-img.png" class="img1" />
				</div>
				<p class="row-text-fleurahita2 text2">FLEURAHITA</p>
			</div>
			
			<div class="row-row-right1 card-light3">
				<p class="row-text-ingin-mencari2">Ingin mencari sesuatu?</p>
				<object data="assets/row-row/row-vuesax-outline.svg" class="row-vuesax-outline-search-a row-vuesax-outline2" type="image/svg+xml"></object>
			</div>
		</div>
		
		<div class="line-c line1"></div>
		
		<!-- Main Content Area -->
		<div class="col2">
			<h2 class="subtitle-pengiriman subtitle-main-color">Pengiriman</h2>
			
			<div class="row8">
				<div class="row9 card-light4">
					<p class="text-cari-pengiriman">Cari Pengiriman</p>
					<object data="assets/row/row-vuesax-outline-568.svg" class="vuesax-outline-search-a vuesax-outline-search1" type="image/svg+xml"></object>
				</div>
				
				<div class="row-i row-right">
					<div class="iconly-light-outline-filter iconly-light">
						<img src="assets/iconly-light-outline-filter/iconly-light-outline-filter-filter.png" class="iconly-light-outline-filter-filter" />
					</div>
					<p class="row-text8">Semua Status</p>
					<object data="assets/row/row-iconly-light2.svg" class="row-iconly-light-outline-arrow-b row-iconly-light" type="image/svg+xml"></object>
				</div>
			</div>
			
			<div class="col3">
				<div class="row-top3">
					<div class="row10">
						<div class="row-j row11">
							<div class="row-line-left2"></div>
							<p class="row-text9">No. Pesanan</p>
						</div>
						
						<div class="row-j row12">
							<div class="row-line-left2"></div>
							<p class="row-text9">Nama Pembeli</p>
						</div>
						
						<div class="row-j row13">
							<div class="row-line-left2"></div>
							<p class="row-text9">Alamat</p>
						</div>
						
						<div class="row-j row14">
							<div class="row-line-left2"></div>
							<p class="row-text9">Status</p>
						</div>
					</div>
					
					<div class="row-k row15">
						<div class="row-line-left3"></div>
						<p class="row-text10">Produk</p>
					</div>
				</div>
				
				<!-- Data rows akan diisi dynamically -->
			</div>
		</div>
	</div>
</body>
</html>
