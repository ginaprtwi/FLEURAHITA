<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Poppins:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Public Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=DM Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Playfair Display:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Manrope:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/pesanan-saya3.css" />
    <link rel="stylesheet" href="../components/css/navbar.css">
    <link rel="stylesheet" href="../components/css/footer.css">

</head>

<body>
        <div id="navbar-container"></div>

        
        <div class="footer-cart card-white2">
            <div class="pesanan-anda">Pesanan anda</div>
            
            <div class="process-b process1" id="order-stepper">
                <div class="process-process4">
                    <button class="btn-a process-btn4 hover-bright" data-step-page="pilih_pengiriman.html">1</button>
                    <p class="text-d">Keranjang belanja</p>
                </div>
                
                <div class="process-process5">
                    <button class="btn-a process-btn5 hover-bright" data-step-page="detail_pesanan.html">2</button>
                    <p class="text-e">Detail pesanan</p>
                </div>
                
                <div class="process-process6">
                    <button class="process-btn6 body-2-semi btn1 hover-bright" data-step-page="pesanan-saya4.html">3</button>
                    <p class="text-d process-text-order-complete2">Pesanan selesai</p>
                </div>
            </div>
        </div>

        <div class="checkout-content">
            <div class="checkout-main">
                <div class="card-form1 card2">
                    <p class="text-f card-form-text">Alamat</p>

                    <div class="input-group-street input-group-street1">
                        <p class="text-g">Nama  penerima</p>
                        <input class="input input-group-street-input" id="namaPenerimaInput" value="" />
                    </div>

                    <div class="input-group-street input-group-street2">
                        <p class="text-g">Alamat</p>
                        <input class="input input-group-street-input" id="alamatInput" value="" />
                    </div>

                    <div class="card-form-country">
                        <p class="text-g">Kecamatan</p>
                        <select class="input" id="kecamatanSelect">
                            <option value="">Kecamatan</option>
                        </select>
                    </div>

                    <div class="input-group-street input-group-street3">
                        <p class="text-g">Kelurahan</p>
                        <select class="input" id="kelurahanSelect">
                            <option value="">Kelurahan</option>
                        </select>
                    </div>

                    <div class="state state1">
                        <div class="input-group-name-b input-group-name1">
                            <p class="input-group-name-text2">Kota/Kabupaten</p>
                            <input class="input input-group-name-input2" id="kotaKabInput" value="" readonly />
                        </div>

                        <div class="input-group-name-b input-group-name2">
                            <p class="input-group-name-text2">Kode Pos</p>
                            <input class="input input-group-name-input2" id="kodePosInput" value="" maxlength="5" />
                        </div>
                    </div>

                    
                </div>

                <div class="card-form2 card2">
                    <p class="text-f card-form-text-metode-pembayaran">Metode Pembayaran</p>

                    <div class="card-form-card">
                        <div class="card-form-col">
                            <div class="card-form-elements payment-option" data-method="gopay">
                                <div class="card-form-radio-btn">
                                    <div class="circle-radio-button-b circle-radio-btn2">
                                        <div class="circle-a circle-radio-button-check2"></div>
                                    </div>
                                    <p class="card-form-text-pay-by text-16px-regular">Gopay</p>
                                </div>
                                <div class="card-form-finance-and">
                                    <div class="circle-a card-form-circle-black1"></div>
                                    <div class="circle-a card-form-circle"></div>
                                    <div class="circle-a card-form-circle-black2"></div>
                                </div>
                            </div>

                            <div class="elements payment-option" data-method="bca">
                                <div class="elements-circle-radio-button elements-circle"></div>
                                <p class="elements-text">BCA</p>
                            </div>

                            <div class="elements payment-option" data-method="tunai">
                                <div class="elements-circle-radio-button elements-circle"></div>
                                <p class="elements-text">Tunai</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="btn7 button-s2 card3 hover-bright">Bayar</div>
            </div>

            <div class="elements-checkout-order elements-checkout-order1">
                <h2 class="elements-checkout-order-subtitle headline4">Order summary</h2>

                <div class="elements-checkout-order-products" id="order-summary-products">
                    <!-- diisi JS: satu blok produk per item keranjang -->

                   <div class="order-summary-coupon">
                        <div class="order-summary-coupon-form-input text-16px-regular card-white3">Input</div>
                        <button class="order-summary-coupon-btn button-s1 btn5 hover-bright">Apply</button>
                    </div>
                </div>

                <div class="elements-checkout-order-fields">
                    <div class="elements-order-summary-info elements-order1">
                        <p class="elements-order-summary-info-text1">Ongkos Kirim</p>
                        <p class="elements-order-summary-info-text2" id="ongkosKirimText">Gratis</p>
                    </div>

                    <div class="elements-order-summary-info elements-order2">
                        <p class="elements-order-summary-info-text1">Subtotal</p>
                        <p class="elements-order-summary-info-text2" id="subtotalText">Rp0</p>
                    </div>

                    <div class="elements-checkout-order-order">
                        <p class="elements-checkout-order-text2 headline2">Total</p>
                        <p class="elements-checkout-order-text-free headline2" id="totalText">Rp0</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="footer-container"></div>

    <script src="../components/js/navbar-loader.js"></script>
    <script src="../components/js/footer-loader.js"></script>
    <script src="order_summary.js"></script>
    <script src="voucher.js"></script>
    <script src="checkout.js"></script>
    <script src="alamat_pesanan.js"></script>
    <script src="pembayaran.js"></script>
    <script src="stepper.js"></script>
</body>

</html>
