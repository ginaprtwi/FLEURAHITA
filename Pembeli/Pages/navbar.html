<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Fleurahita</title>
    <!-- Import Google Fonts for matching typography -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>

    <!-- HTML for Navbar -->
    <header class="fleurahita-navbar">
        <!-- 1. Brand / Logo -->
        <a href="beranda.html" class="fleurahita-navbar-brand" data-nav-link data-page="beranda.html">
            <div class="fleurahita-navbar-logo" title="Logo Fleurahita">
               <img src="../assets/row/row-img.png" class="row-img1" />
            </div>
            <span class="fleurahita-navbar-title">FLEURAHITA</span>
        </a>

        <!-- 2. Navigation Links -->
        <nav class="fleurahita-navbar-nav">
            <!-- TODO: sesuaikan nama file kalau beda dari punya kamu -->
            <a href="beranda.html" class="fleurahita-nav-link" data-nav-link data-page="beranda.html">Beranda</a>
            <a href="produk.html" class="fleurahita-nav-link" data-nav-link data-page="produk.html">Produk</a>
            <a href="pesanan-saya4.html" class="fleurahita-nav-link" data-nav-link data-page="pesanan-saya4.html">Pesanan Saya</a>
        </nav>

        <!-- 3. Actions (Cart, Chat, User) -->
        <div class="fleurahita-navbar-actions">

            <!-- Cart Button -->
            <div class="fleurahita-cart-wrapper" id="cartButton" title="Keranjang">
                <svg class="fleurahita-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <div class="fleurahita-cart-info">
                    <span class="fleurahita-cart-label">Keranjang</span>
                    <span class="fleurahita-cart-price" id="cartTotal">Rp 0,00</span>
                </div>
            </div>

            <!-- Chat Button -->
            <div class="fleurahita-chat-btn" id="chatButton" title="Chat">
                <svg class="fleurahita-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    <circle cx="8" cy="12" r="1.5"></circle>
                    <circle cx="12" cy="12" r="1.5"></circle>
                    <circle cx="16" cy="12" r="1.5"></circle>
                </svg>
            </div>

            <!-- Profile Avatar Button -->
            <div class="fleurahita-profile-btn" id="profileButton" title="Profil Saya">
                <img src="https://i.pravatar.cc/150?img=11" alt="Profile" id="profileImg">
            </div>

        </div>
    </header>

    <!-- JavaScript for Navbar Functionality -->
    <script>
        // ================================================================
        // Navbar ini didesain buat dipasang via <iframe> di tiap halaman.
        // Karena itu, semua navigasi pakai `window.top.location.href`
        // (pindahin halaman UTAMA/parent, bukan cuma isi iframe-nya doang).
        //
        // Kalau file ini dibuka langsung (bukan lewat iframe), window.top
        // sama aja kayak window biasa, jadi tetap jalan normal juga.
        // ================================================================

        // TODO: sesuaikan kalau nama file halaman detail akun beda
        const DETAIL_AKUN_PAGE = 'detail_akun.html';
        // TODO: sesuaikan kalau nama file halaman keranjang beda
        const KERANJANG_PAGE = 'keranjang_di_profil.html';
        // TODO: sesuaikan kalau nama file halaman chat & ulasan beda
        const CHAT_PAGE = 'chat&ulasan.html';

        function goToPage(pageUrl) {
            window.top.location.href = pageUrl;
        }

        // 1. Navigasi link (Beranda / Produk / Pesanan Saya / Logo)
        const navLinks = document.querySelectorAll('[data-nav-link]');

        navLinks.forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault(); // biar gak ke-handle sebagai navigasi di dalam iframe
                const page = this.getAttribute('data-page');
                goToPage(page);
            });
        });

        // 2. Highlight menu yang aktif, berdasarkan halaman yang lagi dibuka di window.top
        function setActiveNavLink() {
            let currentPath;
            try {
                // ambil path dari halaman utama (parent), bukan dari navbar.html ini sendiri
                currentPath = window.top.location.pathname;
            } catch (err) {
                // kalau ke-block sama browser (misal beda origin), fallback ke path sendiri
                currentPath = window.location.pathname;
            }
            const currentFile = currentPath.substring(currentPath.lastIndexOf('/') + 1) || 'beranda.html';

            navLinks.forEach(link => {
                const page = link.getAttribute('data-page');
                if (page === currentFile) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }
        setActiveNavLink();

        // 3. Format Currency Helper Function
        function formatRupiah(amount) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(amount);
        }

        // 4. Update Cart Total dynamically (Example usage)
        function updateCart(amount) {
            const cartTotalElement = document.getElementById('cartTotal');
            if (cartTotalElement) {
                cartTotalElement.textContent = formatRupiah(amount);
            }
        }
        updateCart(0);

        // 5. Action Click Handlers -> navigasi beneran, bukan alert lagi
        document.getElementById('cartButton').addEventListener('click', () => {
            goToPage(KERANJANG_PAGE);
        });

        document.getElementById('chatButton').addEventListener('click', () => {
            goToPage(CHAT_PAGE);
        });

        document.getElementById('profileButton').addEventListener('click', () => {
            goToPage(DETAIL_AKUN_PAGE);
        });

        // 6. Lapor tinggi konten ke halaman utama (parent), biar iframe-nya
        //    auto-resize dan gak ada scrollbar aneh (dipakai bareng layout-include.js)
        //
        // PENTING: jangan pasang listener 'resize' di sini! Kalau parent ngeset
        // tinggi iframe, itu sendiri memicu event 'resize' di DALAM iframe ini,
        // yang bakal lapor tinggi lagi -> parent set lagi -> ulang terus jadi
        // infinite loop (tinggi iframe membengkak gak berhenti).
        function reportHeight() {
            if (window.parent === window) return;
            window.parent.postMessage({
                source: 'fleurahita-layout',
                type: 'navbar-height',
                height: document.body.scrollHeight
            }, '*');
        }
        window.addEventListener('load', () => {
            reportHeight();
            // ukur sekali lagi setelah jeda, jaga-jaga font/gambar telat render
            setTimeout(reportHeight, 300);
        });

    </script>
</body>
</html>
