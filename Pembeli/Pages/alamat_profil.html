<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,300;0,400;0,500;0,600;0,700;0,900;1,100;1,300;1,400;1,500;1,600;1,700;1,900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/pembeli/css/reset.css" />
	<link rel="stylesheet" href="/pembeli/css/global.css" />
	<link rel="stylesheet" href="/pembeli/css/profil3.css" />
</head>

<body>
		<!-- Ruang untuk navbar pengganti -->
	<div class="header-spacer" aria-hidden="true"></div>

	<div class="title title1">Alamat Saya</div>

	<div class="account-section">
		<div class="card-menu card-light">
			<div class="column-e">
				<img id="avatarSidebar" src="/pembeli/assets/auto-layout-horizontal/auto-layout-horizontal-3d-avatars.png" class="column-avatars-3d" alt="Avatar" />
				<div id="namaSidebar" class="column-gibran-rakabuming body-1-semi">Gibran Rakabuming</div>
			</div>

			<div class="card-menu-col">
					<p class="text-elements card-menu-text-elements1" data-nav="akun-saya">Akun Saya</p>
					<p class="text-elements card-menu-text-elements2" data-nav="alamat">Alamat</p>
					<p class="text-elements card-menu-text-elements3">Keranjang</p>
					<p class="text-elements card-menu-text-elements4" data-nav="pesanan-saya">Histori Pesanan</p>
					<p class="text-elements card-menu-text-elements5">Chat &amp; Ulasan</p>
					<p class="text-elements card-menu-text-elements6">Keluar</p>
				</div>
		</div>

		<div class="alamat-section">
			<div class="alamat-heading">Alamat</div>

			<div id="alamatList" class="alamat-list"></div>

			<button id="btnTambahAlamat" type="button" class="alamat-btn hover-bright">Tambah Alamat</button>
		</div>
	</div>

	<!-- Modal Tambah / Edit Alamat -->
	<div id="alamatModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
		<div class="modal-box">
			<div class="modal-head">
				<h3 id="modalTitle" class="modal-title">Tambah Alamat</h3>
				<button id="btnTutupModal" type="button" class="modal-close" aria-label="Tutup">&times;</button>
			</div>

			<form id="formAlamat" novalidate>
				<div class="input-group">
					<label for="alamatLabel">Label Alamat*</label>
					<input id="alamatLabel" type="text" placeholder="Mis. Alamat Rumah / Alamat Kantor" />
				</div>

				<div class="input-group">
					<label for="alamatNama">Nama Penerima*</label>
					<input id="alamatNama" type="text" placeholder="Masukkan nama penerima" />
				</div>

				<div class="input-group">
					<label for="alamatTelp">No. Telepon*</label>
					<input id="alamatTelp" type="tel" placeholder="Masukkan nomor telepon" />
				</div>


				<div class="input-group-row">
					<div class="input-group">
						<label for="alamatKelurahan">Kelurahan/Desa*</label>
						<input id="alamatKelurahan" type="text" placeholder="Masukkan kelurahan/desa" />
					</div>

					<div class="input-group">
						<label for="alamatKecamatan">Kecamatan*</label>
						<input id="alamatKecamatan" type="text" placeholder="Masukkan kecamatan" />
					</div>
				</div>

				<div class="input-group-row">
					<div class="input-group">
						<label for="alamatKota">Kota/Kabupaten*</label>
						<input id="alamatKota" type="text" placeholder="Masukkan kota/kabupaten" />
					</div>

					<div class="input-group">
						<label for="alamatProvinsi">Provinsi*</label>
						<input id="alamatProvinsi" type="text" placeholder="Masukkan provinsi" />
					</div>
				</div>

				<div class="input-group">
					<label for="alamatKodePos">Kode Pos*</label>
					<input id="alamatKodePos" type="text" inputmode="numeric" placeholder="Masukkan kode pos" />
				</div>
				<div class="input-group">
					<label for="alamatDetail">Alamat Lengkap*</label>
					<textarea id="alamatDetail" rows="3" placeholder="Masukkan alamat lengkap, mis. nama jalan, RT/RW, kelurahan, kecamatan, kota"></textarea>
				</div>

				<div class="modal-actions">
					<button id="btnBatalModal" type="button" class="btn-secondary">Batal</button>
					<button type="submit" class="btn-primary">Simpan</button>
				</div>
			</form>
		</div>
	</div>

	<div id="toast" class="toast" role="status" aria-live="polite"></div>

	<script src="/pembeli/js/data.js"></script>
	<script src="/pembeli/js/alamat-saya.js"></script>
</body>
</html>
