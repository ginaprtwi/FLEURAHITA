<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Poppins:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Public Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=DM Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Playfair Display:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Manrope:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/pesanan-saya1.css" />
    <link rel="stylesheet" href="../components/css/navbar.css">
    <link rel="stylesheet" href="../components/css/footer.css">

</head>

<body>
    <div id="navbar-container"></div>
    <div class="col5">
        <div class="title1">
            <div class="title-pesanan-anda headline1">Pesanan anda</div>
            
            <div class="process-a process1" id="order-stepper">
                <div class="process-process1">
                    <button class="btn-a process-btn1 hover-bright" data-step-page="pilih_pengiriman.html">1</button>
                    <p class="text-d">Keranjang belanja</p>
                </div>
                
                <div class="process-process2">
                    <button class="btn-a process-btn2 hover-bright" data-step-page="detail_pesanan.html">2</button>
                    <p class="text-e">Detail pesanan</p>
                </div>
                
                <div class="process-process3">
                    <button class="process-btn6\3 body-2-semi btn1 hover-bright" data-step-page="pesanan-saya4.html">3</button>
                    <p class="text-d process-text-order-complete2">Pesanan selesai</p>
                </div>
            </div>
        </div>
        
        <div class="row-bottom">
            <div class="cart">
                <div class="cart-cart">
                    <div class="cart-table-header">
                        <p class="cart-text-produk body-2-semi">Produk</p>
                        
                        <div class="cart-titles">
                            <p class="cart-text">Jumlah</p>
                            <p class="cart-text">Harga</p>
                            <p class="cart-text">Subtotal</p>
                        </div>
                    </div>
                    
                    <div class="cart-elements" id="cart-items-container">
                        <!-- isi produk di-generate oleh keranjang.js -->
                    </div>
                    <button class="btn-b btn7 hover-bright" id="btn-tambah-pesanan">Tambah Pesanan</button>
                </div>
                
                <div class="elements-cart-summary elements-cart-summary1">
                    <p class="elements-cart-summary-text1 headline2">Pengambilan & Ringkasan Pesanan</p>
                    
                    <div class="elements-cart-summary-content">
                        <div class="elements-cart-summary-fields">
                            <!-- SESUDAH: struktur seragam, gampang di-toggle JS -->
                            <div class="elements-cart-summary-shipping" id="shipping-options">
                                <div class="shipping-option is-active" data-value="pickup">
                                    <div class="circle-radio"><div class="circle-radio-dot"></div></div>
                                    <p class="elements-cart-summary-text-free-shipping">Pick Up</p>
                                </div>
                                <div class="shipping-option" data-value="dropoff">
                                    <div class="circle-radio"><div class="circle-radio-dot"></div></div>
                                    <p class="elements-cart-summary-text-free-shipping">Drop off</p>
                                </div>
                            </div>
                            
                            <div class="elements-cart-summary-order1">
                                <p class="elements-cart-summary-text3">Subtotal</p>
                                <div class="subtotal-values" id="subtotal-list">
                                    <!-- diisi JS: satu baris nominal per produk -->
                                </div>
                            </div>
                            
                            <div class="elements-cart-summary-order2">
                                <p class="elements-cart-summary-text-label">Total</p>
                                <p class="elements-cart-summary-text-value2 body-1-semi">Rp0</p>
                            </div>
                        </div>
                        
                        <button class="btn-b elements-cart-summary-btn hover-bright" id="btn-pesan-sekarang">Pesan sekarang</button>
                    </div>
                </div>
            </div>
            
            
        </div>
    </div>
    
    </footer>    
</body>
</div>
<div id="footer-container"></div>
<script src="../components/js/navbar-loader.js"></script>
<script src="../components/js/footer-loader.js"></script>
<script src="stepper.js"></script>
<script src="keranjang_pengiriman.js"></script>
</html>
