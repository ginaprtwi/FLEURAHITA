<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Poppins:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Public Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=DM Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Playfair Display:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Manrope:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../components/css/navbar.css" />
    <link rel="stylesheet" href="../components/css/footer.css" />
    <link rel="stylesheet" href="../css/keranjang.css" />

</head>

<body>
    <!-- Include Component Navbar -->
    <div id="navbar-container"></div>
    <script src="../components/js/navbar-loader.js"></script>
    
    <div class="keranjang-saya headline3">Keranjang Saya</div>
    
    <div class="wishlist">
        <div class="content content1">
            <div class="content-caption">
                <p class="content-text-a content-text1">Produk</p>
                <p class="content-text-a content-text-harga">Harga</p>
                <p class="content-text-a content-text-action">Action</p>
            </div>
            
            <div class="content-item">
                <div class="content-elements">
                    <object data="../assets/cart-icons-close.svg" class="icons-close-line content-icons-close" type="image/svg+xml"></object>
                    
                    <div class="content-content">
                        <img src="../assets/content-content/content-img.png" class="content-img" />
                        
                        <div class="info info1">
                            <div class="info-lush-and-plush body-xl">Lush and Plush</div>
                            <p class="text-c">Warna : Ungu</p>
                        </div>
                    </div>
                </div>
                
                <p class="content-text-rp caption2">Rp.135.000</p>
                <button class="btn-d content-btn hover-bright">Beli Sekarang</button>
            </div>
        </div>
        
        <div class="wishlist-content1">
            <div class="wishlist-elements">
                <object data="../assets/cart-icons-close.svg" class="icons-close-line wishlist-icons-close" type="image/svg+xml"></object>
                
                <div class="wishlist-content2">
                    <img src="../assets/keranjang/wishlist-img.png" class="wishlist-img" />
                    
                    <div class="info info2">
                        <div class="info-lush-and-plush body-xl">Sweet Aurora Bloom</div>
                        <p class="text-c info-text">Warna : Ungu</p>
                    </div>
                </div>
            </div>
            
            <p class="wishlist-text caption2">250.000</p>
            <button class="btn-d wishlist-btn1 hover-bright">Beli Sekarang</button>
        </div>
        
        <button class="btn-d wishlist-btn2 hover-bright">Tambah Pesanan</button>
    </div>
    
    <div class="elements-cart-coupon">
        <div class="elements-cart-coupon-title">
            <div class="elements-cart-coupon-apa-kamu-punya headline2">Apa kamu punya voucher?</div>
            <p class="elements-cart-coupon-text-tambahkan-voucher body-a">
                Tambahkan voucher anda untuk dapatkan diskon terbaik
            </p>
        </div>
        
        <div class="elements-cart-coupon-form-input">
            <div class="elements-cart-coupon-input">
                <div class="elements-cart-coupon-icon">
                    <object data="../assets/keranjang/elements-cart-coupon-ticket-percent.svg" class="elements-cart-coupon-ticket-percent" type="image/svg+xml"></object>
                    <p class="elements-cart-coupon-text-your button-s1">Voucher</p>
                </div>
                
                <p class="elements-cart-coupon-text-btn button-s1">Kirim</p>
            </div>
        </div>
    </div>
    
    <!-- Include Component Footer -->
    <div id="footer-container"></div>
    <script src="../components/js/footer-loader.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
