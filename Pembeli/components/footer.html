    <script>
        // Footer ini juga didesain buat dipasang via <iframe> (sama kayak navbar.html),
        // jadi klik link di sini pindahin halaman UTAMA (window.top), bukan cuma iframe-nya.
        const footerNavLinks = document.querySelectorAll('[data-nav-link]');
        footerNavLinks.forEach(link => {
            link.addEventListener('click', function (e) {
                const page = this.getAttribute('data-page');
                if (!page) return; // link "#" (sosmed) dibiarkan default
                e.preventDefault();
                window.top.location.href = page;
            });
        });

        // Lapor tinggi konten ke halaman utama, biar iframe auto-resize
        //
        // PENTING: jangan pasang listener 'resize' di sini! Kalau parent ngeset
        // tinggi iframe, itu sendiri memicu event 'resize' di DALAM iframe ini,
        // yang bakal lapor tinggi lagi -> parent set lagi -> ulang terus jadi
        // infinite loop (tinggi iframe membengkak gak berhenti).
        function reportFooterHeight() {
            if (window.parent === window) return;
            window.parent.postMessage({
                source: 'fleurahita-layout',
                type: 'footer-height',
                height: document.body.scrollHeight
            }, '*');
        }
        window.addEventListener('load', () => {
            reportFooterHeight();
            setTimeout(reportFooterHeight, 300);
        });
    </script>
