<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Fleurahita</title>
    <!-- Import Google Fonts for matching typography -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>

    <!-- HTML for Navbar -->
    <header class="fleurahita-navbar">
        <!-- 1. Brand / Logo -->
        <a href="index.html" class="fleurahita-navbar-brand">
            <div class="fleurahita-navbar-logo" title="Logo Fleurahita">
                <!-- Fallback if img logo is not available, uses CSS pseudo-element -->
            </div>
            <span class="fleurahita-navbar-title">FLEURAHITA</span>
        </a>

        <!-- 2. Navigation Links -->
        <nav class="fleurahita-navbar-nav">
            <a href="#beranda" class="fleurahita-nav-link active" data-page="beranda">Beranda</a>
            <a href="#produk" class="fleurahita-nav-link" data-page="produk">Produk</a>
            <a href="#pesanan" class="fleurahita-nav-link" data-page="pesanan">Pesanan Saya</a>
        </nav>

        <!-- 3. Actions (Cart, Chat, User) -->
        <div class="fleurahita-navbar-actions">
            
            <!-- Cart Button -->
            <div class="fleurahita-cart-wrapper" id="cartButton" onclick="handleCartClick()">
                <svg class="fleurahita-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <div class="fleurahita-cart-info">
                    <span class="fleurahita-cart-label">Keranjang</span>
                    <span class="fleurahita-cart-price" id="cartTotal">Rp 0,00</span>
                </div>
            </div>

            <!-- Chat Button -->
            <div class="fleurahita-chat-btn" id="chatButton" onclick="handleChatClick()" title="Chat">
                <svg class="fleurahita-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    <circle cx="8" cy="12" r="1.5"></circle>
                    <circle cx="12" cy="12" r="1.5"></circle>
                    <circle cx="16" cy="12" r="1.5"></circle>
                </svg>
            </div>

            <!-- Profile Avatar Button -->
            <div class="fleurahita-profile-btn" id="profileButton" onclick="handleProfileClick()" title="Profil Saya">
                <!-- Using a placeholder image that loosely resembles the boy holding flowers -->
                <img src="https://i.pravatar.cc/150?img=11" alt="Profile" id="profileImg">
            </div>

        </div>
    </header>

    <!-- JavaScript for Navbar Functionality -->
    <script>
        // 1. Handle Navigation Active State
        const navLinks = document.querySelectorAll('.fleurahita-nav-link');
        
        navLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                // Prevent default anchor behavior for demonstration
                // In production, you might let it navigate normally, or use JS router
                
                // Remove active class from all links
                navLinks.forEach(l => l.classList.remove('active'));
                
                // Add active class to clicked link
                this.classList.add('active');
                
                const page = this.getAttribute('data-page');
                console.log('Navigated to: ' + page);
            });
        });

        // 2. Format Currency Helper Function
        function formatRupiah(amount) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(amount);
        }

        // 3. Update Cart Total dynamically (Example usage)
        // You can call updateCart(50000) when user adds an item
        function updateCart(amount) {
            const cartTotalElement = document.getElementById('cartTotal');
            if(cartTotalElement) {
                cartTotalElement.textContent = formatRupiah(amount);
            }
        }

        // 4. Action Click Handlers
        function handleCartClick() {
            // Trigger cart modal or navigation
            alert('Menampilkan halaman Keranjang');
            // window.location.href = 'keranjang.html';
        }

        function handleChatClick() {
            // Trigger chat modal or navigation
            alert('Membuka jendela Chat');
            // window.location.href = 'chat.html';
        }

        function handleProfileClick() {
            // Trigger profile dropdown or navigation
            alert('Menampilkan menu Profil');
            // document.getElementById('profileDropdown').classList.toggle('show');
        }

        // Initialize cart value for demonstration (e.g., 0)
        updateCart(0);

    </script>
</body>
</html>
